<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClashMIT map themes</title>
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<style>
:root{font-family:system-ui,sans-serif;color:#f6f4ef;background:#101217}body{margin:0;padding:16px}
h1{font-size:1.05rem;margin:0 0 4px}p{margin:0 0 14px;color:#a5a9b5;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:#171b24;border:1px solid #2c3444;border-radius:16px;padding:12px}
.card h2{margin:0 0 8px;font-size:1rem}.card code{color:#ff9958;font-size:.8rem}
.views{display:flex;gap:10px;align-items:flex-start}
.map{position:relative;overflow:hidden;background:#0d131c}.corner{width:122px;height:122px;border-radius:22px;border:1.5px solid #8fb4ff4d;flex-shrink:0}.wide{flex:1;height:250px;border-radius:12px}
.map .maplibregl-map{position:absolute;inset:0}
.dot{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:#c9b19a;border:3px solid #fff;box-shadow:0 0 0 1.5px #0b1018}
</style></head><body>
<h1>Map themes</h1><p>Vector map, no text, sharp at every zoom. Left: the corner map at 50 m, turned to a heading. Right: the full-screen scale. Add <code>?map=name</code> to the game URL to try one in play.</p>
<div id="grid" class="grid"></div>
<script type="module">
import * as maplibre from './vendor/maplibre/maplibre-gl.js';
import {THEMES,DEFAULT_THEME,mapStyle} from './minimap-tiles.js?v=map9';
maplibre.setWorkerUrl(new URL('./vendor/maplibre/maplibre-gl-worker.js',import.meta.url).href);
const params=new URLSearchParams(location.search),center=[Number(params.get('lon'))||-71.0921,Number(params.get('lat'))||42.3591],dots=[['50%','50%','#fff'],['34%','30%','#ff7a5a'],['70%','66%','#6ec8ff']];
for(const [key,theme] of Object.entries(THEMES)){
 const card=document.createElement('section');card.className='card';card.innerHTML=`<h2>${theme.name}${key===DEFAULT_THEME?' · current default':''} <code>?map=${key}</code></h2><div class="views"><div class="map corner"></div><div class="map wide"></div></div>`;document.getElementById('grid').append(card);
 card.querySelectorAll('.map').forEach((holder,i)=>{const el=document.createElement('div');holder.append(el);new maplibre.Map({container:el,style:mapStyle(key),center,zoom:i?16.6:15.9,bearing:i?0:25,interactive:!!i,attributionControl:false,fadeDuration:0});
  for(const [left,top,color] of dots){const d=document.createElement('i');d.className='dot';d.style.cssText=`left:${left};top:${top};border-color:${color}`;holder.append(d);}});
}
</script></body></html>
