<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClashMIT · Attack lab</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/design-tokens.css"><link rel="stylesheet" href="/upgrades-demo.css"><link rel="stylesheet" href="/shield-effect.css"></head>
<body><header><a href="/"><img src="/favicon.svg" alt="">ClashMIT</a><span>Attack lab</span><button id="stop" type="button">Stop</button></header>
<main><section class="preview" aria-label="Effect preview"><div id="stage">
<div class="stage-note">Effect preview · no live players</div><div class="floor"></div>
<div class="target extra left" data-target="1"><i></i><b></b><span>Nearby</span></div>
<div class="target primary" data-target="0"><i></i><b></b><span>Target</span></div>
<div class="target extra right" data-target="2"><i></i><b></b><span>Nearby</span></div>
<div id="flash" aria-hidden="true"></div><div id="shield" aria-hidden="true"></div><div id="heal" aria-hidden="true">+</div>
<div class="stage-hud"><div id="health" aria-label="7 hearts"></div><span id="timer"></span></div></div>
<div class="readout"><h1 id="effect-name">Choose an attack</h1><p id="detail">Tap a button to play its sound and animation.</p><p id="status" role="status">Ready</p><p id="audio-status"></p></div>
</section><section class="catalog" aria-label="Attack and consumable buttons"><div class="tools"><label>Volume <input id="volume" type="range" min="0" max="100" value="60"></label><a href="/sounds.html">Sound credits</a></div><div id="attacks"></div><section class="items"><h2>Consumables</h2><p>Flashbang shows the victim’s view for 3 seconds.</p><div id="consumables"></div><p class="credits">Reaper art: <a href="https://commons.wikimedia.org/wiki/File:The_death.svg">MesserWoland / 1ur1</a> · <a href="https://creativecommons.org/licenses/by/2.0/">CC BY 2.0</a></p></section></section></main><script type="module" src="/upgrades-demo.js"></script></body></html>
