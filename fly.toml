# Set a globally unique app name during `fly launch --no-deploy`.
# Choose the region nearest the field. Use exactly ONE machine for shared state.
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "3000"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
